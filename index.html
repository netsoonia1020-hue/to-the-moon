<style>

html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#eee;

  background:radial-gradient(ellipse at 50% 120%,rgba(30,40,80,.4),rgba(0,0,0,.55));text-align:center;cursor:pointer}

#puzzle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:rgba(14,12,10,.96);
  border:1px solid #8a6d3b;border-radius:12px;padding:18px 20px;width:min(94vw,560px);box-sizing:border-box;box-shadow:0 10px 50px #000}
#puzzle .t{font-size:18px;color:#f2c46d;margin-bottom:4px}
#puzzle .h{font-size:14px;color:#bba;margin-bottom:12px}
#pzGrid{display:grid;grid-template-columns:42px repeat(6,1fr);gap:4px;margin-bottom:12px}
.pzl{font-size:13px;color:#bba;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.pzc{height:30px;border-radius:5px;background:#3a2c1c;border:1px solid #5a4630;cursor:pointer;position:relative}
.pzc.on::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#f4dc8a;box-shadow:0 0 8px #f4dc8a}
.pzc.cur{outline:2px solid #8fb8e8}

.pzb{display:flex;gap:8px;flex-wrap:wrap}

.pzb button:hover{background:#3a2c1c}
#pzMsg{min-height:1.5em;margin-top:10px;font-size:15px;color:#e9dfc6;text-align:center}
#touch{position:absolute;inset:auto 0 0 0;height:190px;z-index:8;pointer-events:none}
.tb{position:absolute;width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,.75)}
.tb:active,.tb.down{background:rgba(255,255,255,.28)}
#tA{right:26px;bottom:60px;width:84px;height:84px;border-radius:50%;font-size:17px}
#endcard{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;opacity:0;transition:opacity 3s}
#endcard h1{font-weight:300;letter-spacing:.2em;font-size:clamp(26px,5vw,48px);margin:0 0 10px}
#endcard p{color:#99a;margin:6px}
#endcard button{margin-top:30px;font:inherit;background:none;color:#eee;border:1px solid #666;border-radius:30px;padding:10px 26px;cursor:pointer}

<body>
<canvas id="c" width="320" height="192"></canvas>
<div id="toast"></div>
<div id="hud"></div>
<div id="hint">방향키 / WASD 이동 · Space / Enter 조사</div>
<div id="dialog" class="hidden"><div id="dname"></div><div id="dtext"></div><div id="dnext" class="hidden">▼</div></div>
<div id="choices" class="hidden"></div>
<div id="puzzle" class="hidden">
  <div class="t">오르골 원통 — 핀 꽂기</div>
  <div class="h">한 칸에 하나씩, 왼쪽부터 순서대로 울립니다.<br>기억 속에서 들은 음: <b id="pzHint"></b></div>
  <div id="pzGrid"></div>
  <div class="pzb"><button id="pzPlay">태엽 감기 ▶</button><button id="pzClear">초기화</button><button id="pzClose">닫기</button></div>
  <div id="pzMsg"></div>
</div>
<div id="touch" class="hidden">
  <div class="tb" data-d="up" style="left:78px;bottom:126px">▲</div>
  <div class="tb" data-d="left" style="left:12px;bottom:64px">◀</div>
  <div class="tb" data-d="right" style="left:144px;bottom:64px">▶</div>
  <div class="tb" data-d="down" style="left:78px;bottom:2px">▼</div>
  <div class="tb" id="tA">조사</div>
</div>
<div id="fader"></div>
<div id="card"></div>
<div id="title">
  <h1>등대지기의 오르골</h1>
  <div class="sub">어느 유품정리사가 본, 여섯 음의 기억</div>
  <div class="start">▶ 시작하기</div>
  <div class="small">헤드폰 권장 · 약 15분 · 방향키/WASD + Space</div>
</div>
<div id="endcard" class="hidden"><h1>등대지기의 오르골</h1><p>끝까지 들어 주셔서 고맙습니다.</p><button id="restart">처음부터</button></div>

<script>
'use strict';
/* =========================================================
   기본 설정
   ========================================================= */
const W=320,H=192,TS=16,COLS=20,ROWS=12;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lx=lc.getContext('2d');
const vg=document.createElement('canvas');vg.width=W;vg.height=H;
{const g=vg.getContext('2d'),r=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);
 r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.65)');g.fillStyle=r;g.fillRect(0,0,W,H);}
let T=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function hsh(x,y){let n=(x*374761393+y*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return (n^(n>>>16))>>>0;}
const shadeCache={};
function shade(c,k=.78){const key=c+k;if(shadeCache[key])return shadeCache[key];const n=parseInt(c.slice(1),16);
  return shadeCache[key]=`rgb(${(n>>16)*k|0},${((n>>8)&255)*k|0},${(n&255)*k|0})`;}
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;

function layout(){
  const vw=innerWidth,vh=innerHeight,portrait=vh>vw*1.1;let s,l,t;
  if(portrait){s=vw/W;l=0;t=Math.min(48,vh*.06);}
  else{s=Math.min(vw/W,vh/H);l=(vw-W*s)/2;t=(vh-H*s)/2;}
  Object.assign(cv.style,{width:W*s+'px',height:H*s+'px',left:l+'px',top:t+'px'});
  document.documentElement.style.setProperty('--s',s);
  const dlg=$('dialog'),ch=$('choices');
  let bottom=18;
  if(isTouch){bottom=portrait?205:12;dlg.style.width=portrait?'92vw':'min(56vw,640px)';}
  dlg.style.bottom=bottom+'px';
  ch.style.bottom=(bottom+dlg.offsetHeight+10)+'px';
  $('hud').style.top=$('toast').style.top=(t+8)+'px';
  $('hud').style.right=(portrait?12:Math.max(12,l+10))+'px';$('toast').style.left=(portrait?12:Math.max(12,l+12))+'px';
}
addEventListener('resize',layout);

/* =========================================================
   오디오 (WebAudio로 직접 합성)
   ========================================================= */
const A={};
const mf=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(A.C)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=A.C=new AC();
  A.master=C.createGain();A.master.gain.value=.7;
  const comp=C.createDynamicsCompressor();A.master.connect(comp);comp.connect(C.destination);
  const len=C.sampleRate*2.8,ib=C.createBuffer(2,len,C.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  A.rev=C.createConvolver();A.rev.buffer=ib;const rg=C.createGain();rg.gain.value=.4;A.rev.connect(rg);rg.connect(A.master);
  A.music=C.createGain();A.music.gain.value=.55;A.music.connect(A.master);A.music.connect(A.rev);
  A.sfx=C.createGain();A.sfx.gain.value=.7;A.sfx.connect(A.master);A.sfx.connect(A.rev);
  A.amb=C.createGain();A.amb.gain.value=1;A.amb.connect(A.master);
  const nb=C.createBuffer(1,C.sampleRate*3,C.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
  setInterval(bgmTick,90);
  if(A.pendingBgm)playBgm(A.pendingBgm);if(A.pendingAmb)setAmb(A.pendingAmb);
}
function env(g,t,v,a,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function piano(m,t,dur,vol,dest){
  const C=A.C;if(!C)return;dest=dest||A.music;
  const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;f.connect(dest);
  const g=C.createGain();env(g,t,vol,.006,dur);g.connect(f);
  const o=C.createOscillator();o.type='triangle';o.frequency.value=mf(m);o.connect(g);
  const o2=C.createOscillator();o2.type='sine';o2.frequency.value=mf(m)*2;const g2=C.createGain();env(g2,t,vol*.25,.004,dur*.4);o2.connect(g2);g2.connect(f);
  o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
}
function mbox(m,t,vol=.16,dest){
  const C=A.C;if(!C)return;dest=dest||A.sfx;
  [[1,1,2.2],[4.02,.22,.35],[2,.18,.9]].forEach(([k,v,d])=>{
    const o=C.createOscillator();o.type='sine';o.frequency.value=mf(m+12)*k;
    const g=C.createGain();env(g,t,vol*v,.003,d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.1);});
}
function voice(m,t,dur,vol=.12,dest){
  const C=A.C;if(!C)return;dest=dest||A.sfx;
  const o=C.createOscillator();o.type='sine';o.frequency.value=mf(m);
  const lfo=C.createOscillator();lfo.frequency.value=5.2;const lg=C.createGain();lg.gain.value=mf(m)*.012;lfo.connect(lg);lg.connect(o.frequency);
  const o2=C.createOscillator();o2.type='triangle';o2.frequency.value=mf(m);const g2=C.createGain();g2.gain.value=.25;o2.connect(g2);
  const g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.09);
  g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);
  o.connect(g);g2.connect(g);g.connect(dest);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+dur+.3);});
}
function noiseBurst(t,dur,freq,type,vol,q=1){
  const C=A.C;if(!C)return;const s=C.createBufferSource();s.buffer=A.noise;
  const f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=C.createGain();env(g,t,vol,.005,dur);s.connect(f);f.connect(g);g.connect(A.sfx);s.start(t,Math.random()*2);s.stop(t+dur+.1);
  return f;
}
const SFX={
  blip(){if(!A.C)return;const C=A.C,t=C.currentTime,o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.value=520+Math.random()*60;
    env(g,t,.018,.003,.05);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+.08);},
  chime(){if(!A.C)return;const t=A.C.currentTime;[76,79,84,88].forEach((m,i)=>mbox(m,t+i*.09,.12));},
  whoosh(){if(!A.C)return;const t=A.C.currentTime,f=noiseBurst(t,2,300,'bandpass',.5,.8);
    if(f){f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(5000,t+1.6);}
    [72,76,79,83,86,91].forEach((m,i)=>mbox(m,t+.15+i*.12,.08));},
  ring(){if(!A.C)return;const C=A.C,t0=C.currentTime;for(let k=0;k<2;k++)for(let i=0;i<10;i++){const t=t0+k*1.4+i*.06;
    [440,480].forEach(fq=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=fq;env(g,t,.035,.005,.05);o.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+.08);});}},
  knock(){if(!A.C)return;const t=A.C.currentTime;for(let i=0;i<3;i++){noiseBurst(t+i*.32,.12,180,'lowpass',.9);noiseBurst(t+i*.32,.05,900,'bandpass',.25);}},
  door(){if(!A.C)return;const t=A.C.currentTime;const f=noiseBurst(t,.6,500,'bandpass',.25,6);if(f){f.frequency.setValueAtTime(400,t);f.frequency.linearRampToValueAtTime(900,t+.5);}
    noiseBurst(t+.55,.15,150,'lowpass',.6);},
  drawer(){if(!A.C)return;const t=A.C.currentTime;noiseBurst(t,.35,700,'bandpass',.3,2);noiseBurst(t+.3,.08,200,'lowpass',.5);},
  key(){if(!A.C)return;const t=A.C.currentTime;[2400,3100,2700].forEach((f,i)=>{const o=A.C.createOscillator(),g=A.C.createGain();o.frequency.value=f;env(g,t+i*.07,.03,.002,.12);o.connect(g);g.connect(A.sfx);o.start(t+i*.07);o.stop(t+i*.07+.2);});},
  crank(){if(!A.C)return;const t=A.C.currentTime;for(let i=0;i<7;i++)noiseBurst(t+i*.09,.03,2500,'bandpass',.25,3);noiseBurst(t+.75,.2,300,'lowpass',.5);},
  thunder(){if(!A.C)return;const t=A.C.currentTime;noiseBurst(t,2.6,120,'lowpass',.9);noiseBurst(t+.1,1.4,400,'lowpass',.3);},
  pin(m){if(!A.C)return;mbox(m,A.C.currentTime,.12);},
};
// 환경음
function setAmb(name){
  if(!A.C){A.pendingAmb=name;return;}
  const C=A.C,t=C.currentTime;
  if(A.ambNode){const old=A.ambNode;old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(old.g.gain.value,t);old.g.gain.linearRampToValueAtTime(0,t+1.5);setTimeout(()=>{try{old.src.stop();old.lfo&&old.lfo.stop();}catch(e){}},1700);A.ambNode=null;}
  A.ambName=name;if(!name)return;
  const src=C.createBufferSource();src.buffer=A.noise;src.loop=true;
  const g=C.createGain();g.gain.value=0;const node={src,g};
  let chain=src,vol=.05;
  const filt=(type,f,q=.7)=>{const b=C.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;chain.connect(b);chain=b;return b;};
  if(name==='rain'){filt('highpass',900);filt('lowpass',5500);vol=.07;}
  if(name==='storm'){filt('highpass',500);filt('lowpass',4500);vol=.1;}
  if(name==='wind'){filt('bandpass',380,.6);vol=.06;}
  if(name==='waves'){filt('lowpass',650);vol=.11;}
  if(name==='waves'||name==='wind'){
    const lfo=C.createOscillator();lfo.frequency.value=name==='waves'?.13:.07;const lg=C.createGain();lg.gain.value=vol*.8;
    lfo.connect(lg);lg.connect(g.gain);lfo.start();node.lfo=lfo;}
  chain.connect(g);g.connect(A.amb);src.start();
  g.gain.linearRampToValueAtTime(vol,t+2);A.ambNode=node;
}
// 배경음악: 느린 아르페지오
const BGM={
  title:{bpm:58,ch:[[45,64,69,72],[41,65,69,72],[48,64,67,72],[43,62,67,71]],pat:[1,2,3,2,-1,3,2,-1],vol:.06},
  present:{bpm:62,ch:[[45,64,69,72],[41,65,69,72],[48,64,67,72],[43,62,67,71]],pat:[1,2,3,2,1,3,2,3],vol:.06},
  m1:{bpm:56,ch:[[38,62,65,69],[46,62,65,70],[41,60,65,69],[48,60,64,67]],pat:[1,3,2,3,1,3,2,-1],vol:.06},
  m2:{bpm:50,ch:[[45,60,64,69],[40,59,64,67],[41,60,65,69],[40,59,64,68]],pat:[1,-1,3,-1,2,-1,3,-1],vol:.065},
  m3:{bpm:70,ch:[[36,64,67,72],[43,62,67,71],[45,64,69,72],[41,65,69,72]],pat:[1,2,3,2,1,2,3,2],vol:.055},
  end:{bpm:60,ch:[[36,64,67,72],[43,62,67,71],[45,64,69,72],[41,65,69,72]],pat:[1,-1,3,-1,2,-1,3,-1],vol:.05},
};
function playBgm(name){
  if(!A.C){A.pendingBgm=name;return;}
  if(A.bgm&&A.bgm.name===name)return;
  const C=A.C,t=C.currentTime;
  if(A.bgm){const o=A.bgm;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+2);setTimeout(()=>o.g.disconnect(),2600);A.bgm=null;}
  if(!name)return;
  const g=C.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(1,t+2.5);g.connect(A.music);
  A.bgm={name,g,step:0,next:t+.2,def:BGM[name]};
}
function bgmTick(){
  const b=A.bgm;if(!b)return;const C=A.C,d=b.def,sd=60/d.bpm/2;
  while(b.next<C.currentTime+.4){
    const bar=Math.floor(b.step/8)%d.ch.length,i=b.step%8,ch=d.ch[bar],p=d.pat[i];
    if(i===0)piano(ch[0],b.next,sd*8,d.vol*1.1,b.g),piano(ch[0]+12,b.next,sd*6,d.vol*.5,b.g);
    if(p>0)piano(ch[p],b.next,sd*5,d.vol*(.75+Math.random()*.3),b.g);
    b.step++;b.next+=sd;

function duck(on){if(!A.C)return;const t=A.C.currentTime;A.music.gain.cancelScheduledValues(t);A.music.gain.setValueAtTime(A.music.gain.value,t);A.music.gain.linearRampToValueAtTime(on?.12:.55,t+.6);}
// 멜로디 재생: seq=[[midi,beats],...]
async function playSeq(seq,bpm,fn,{ duckIt=true,onNote}={}){
  if(!A.C){await wait(seq.reduce((a,n)=>a+n[1],0)*60000/bpm);return;}
  if(duckIt)duck(true);
  const b=60/bpm;let t=A.C.currentTime+.15,acc=0;
  seq.forEach(([m,bt],i)=>{if(m)fn(m,t+acc,bt*b);if(onNote)setTimeout(()=>onNote(i),(acc+.15)*1000);acc+=bt*b;});
  await wait(acc*1000+500);
  if(duckIt)duck(false);
}

  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,16);g.addColorStop(0,`rgba(255,236,170,${.45*p})`);g.addColorStop(1,'rgba(255,236,170,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-16,cy-16,32,32);
  for(let i=0;i<3;i++){const a=T*1.6+i*2.09,r=9+Math.sin(T*2+i)*2,sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r*.6;
    R(sx,sy,1,1,'#fff6d0');if((i+Math.floor(T*4))%3===0){R(sx-1,sy,3,1,'rgba(255,246,208,.6)');R(sx,sy-1,1,3,'rgba(255,246,208,.6)');}}
}

const NAMECOL={'서윤':'#f2c46d','정우':'#8fb8e8','은하':'#f0a8b8','미래':'#c7a8f0'};
let typeSkip=null,waiters=[],choice=null;
function waitAction(){return new Promise(r=>waiters.push(r));}
async function say(name,text){
  const d=$('dialog'),nm=$('dname'),tx=$('dtext'),nx=$('dnext');
  d.classList.remove('hidden');nx.classList.add('hidden');
  nm.textContent=name||'';nm.style.color=NAMECOL[name]||'#ddd';nm.style.display=name?'':'none';
  const inner=name&&text.startsWith('(');
  tx.className=!name?'narr':inner?'inner':'';tx.textContent='';layout();
  await new Promise(res=>{
    let i=0,done=false;
    const fin=()=>{if(done)return;done=true;clearInterval(iv);tx.textContent=text;typeSkip=null;res();};
    const iv=setInterval(()=>{i++;tx.textContent=text.slice(0,i);if(i%3===1&&text[i-1]!==' ')SFX.blip();if(i>=text.length)fin();},30);
    typeSkip=fin;
  });
  nx.classList.remove('hidden');
  await waitAction();
  nx.classList.add('hidden');
}
function hideDialog(){$('dialog').classList.add('hidden');}
function choose(opts){
  return new Promise(res=>{
    const el=$('choices');el.innerHTML='';
    const fin=i=>{el.classList.add('hidden');choice=null;SFX.blip();res(i);};
    choice={n:opts.length,sel:0,fin,render(){[...el.children].forEach((c,j)=>c.classList.toggle('sel',j===choice.sel));}};
    opts.forEach((o,i)=>{const b=document.createElement('div');b.className='ch';b.textContent=o;
      b.onpointerdown=ev=>{ev.stopPropagation();fin(i);};b.onmouseenter=()=>{if(choice){choice.sel=i;choice.render();}};el.appendChild(b);});
    el.classList.remove('hidden');layout();choice.render();
  });
}
function setOp(el,v,ms){el.style.transition=`opacity ${ms}ms`;void el.offsetWidth;el.style.opacity=v;return wait(ms);}
async function cardShow(html,ms=700){const c=$('card');c.innerHTML=html;await setOp(c,1,ms);}
async function cardHide(ms=1000){await setOp($('card'),0,ms);}
let toastT=0;
function toast(t,ms=3500){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,ms);}
function hud(){
  const h=$('hud');let s='';
  if(S&&S.frags){const n=S.frags.filter(f=>F[f]).length;s+=`기억의 조각 ${'◆'.repeat(n)}${'◇'.repeat(S.frags.length-n)}<br>`;}
  if(F.notes.length){const all=[...F.notes];while(all.length<6)all.push(null);s+='♪ '+all.map(m=>m?NOTE_NAME[m]:'·').join(' ');}
  h.innerHTML=s;
}
async function addNotes(ns){F.notes.push(...ns);hud();SFX.chime();toast('음의 조각을 얻었다 — '+ns.map(m=>NOTE_NAME[m]).join(' · '),4500);}
function walk(e,path,speed=2.6){return new Promise(r=>{e.path=path.map(p=>p.slice());e.speed=speed;e.onDone=r;});}
async function run(fn){
  if(locked)return;locked=true;
  try{await fn();}catch(err){console.error(err);}
  hideDialog();locked=false;
}
// 기억 조각 래퍼: 세 개가 모이면 장면의 finale 실행
function frag(id,fn){
  return async e=>{
    await fn(e,!!F[id]);
    if(!F[id]){F[id]=true;e.glow=false;SFX.chime();hud();
      const n=S.frags.filter(f=>F[f]).length;toast(`기억의 조각 (${n}/${S.frags.length})`);
      if(n>=S.frags.length&&S.finale){hideDialog();await wait(500);await S.finale();}}
  };
}

function loadScene(name){
  S=SC[name];S.lit=!!S.litInit;ents=S.ents();
  const [x,y,d]=S.start;Object.assign(P,{x,y,fx:x,fy:y,tx:x,ty:y,dir:d,moving:false,hidden:!!S.noPlayer});
  playBgm(S.bgm);setAmb(S.amb);hud();
}
async function goScene(name,cardHtml,{white=true,hold=2600}={}){
  locked=true;hideDialog();
  if(white){SFX.whoosh();await setOp($('fader'),1,1100);}
  await cardShow(cardHtml,white?500:1200);
  $('fader').style.transition='none';$('fader').style.opacity=0;
  loadScene(name);
  await wait(hold);await cardHide(1300);
  if(S.title)toast(S.title);
  locked=false;
  if(S.enter)await run(S.enter);
}

    PZ_ROWS.forEach((m,r)=>{const l=document.createElement('div');l.className='pzl';l.textContent=NOTE_NAME[m];grid.appendChild(l);
      for(let c=0;c<6;c++){const d=document.createElement('div');d.className='pzc';d.onpointerdown=ev=>{ev.stopPropagation();cur={c,r};toggle(c,r);};grid.appendChild(d);cells.push(d);}});
    const render=()=>cells.forEach((d,i)=>{const r=Math.floor(i/6),c=i%6;d.classList.toggle('on',pins[c]===r);d.classList.toggle('cur',!isTouch&&cur.c===c&&cur.r===r);});
    function toggle(c,r){if(busy)return;pins[c]=pins[c]===r?-1:r;if(pins[c]>=0)SFX.pin(PZ_ROWS[r]);msg.textContent='';render();}
    async function play(){
      if(busy)return;busy=true;msg.textContent='드르륵… 태엽이 풀린다.';
      const seq=pins.map((r,i)=>[r>=0?PZ_ROWS[r]:0,MOTIF[i][1]]);
      await boxPlay(seq,84,{onNote:i=>cells.forEach((d,j)=>d.classList.toggle('play',j%6===i))});
      cells.forEach(d=>d.classList.remove('play'));
      const ok=pins.every((r,i)=>r>=0&&PZ_ROWS[r]===PZ_ANS[i]);
      if(ok){msg.textContent='…이 노래다.';await wait(1400);close(true);}
      else if(pins.includes(-1)){msg.textContent='비어 있는 자리가 있다. 노래가 중간중간 끊긴다.';busy=false;}
      else{msg.textContent='어딘가 어긋난 소리다. 기억 속 순서를 떠올려 보자.';busy=false;}
    }
    function close(v){pz.classList.add('hidden');puzzleKeys=null;res(v);}
    $('pzPlay').onclick=play;$('pzClear').onclick=()=>{if(!busy){pins.fill(-1);render();msg.textContent='';}};$('pzClose').onclick=()=>{if(!busy)close(false);};
    puzzleKeys=k=>{if(busy)return;
      if(k==='left')cur.c=(cur.c+5)%6;else if(k==='right')cur.c=(cur.c+1)%6;else if(k==='up')cur.r=(cur.r+6)%7;else if(k==='down')cur.r=(cur.r+1)%7;
      else if(k==='act')toggle(cur.c,cur.r);else if(k==='enter')play();else if(k==='esc')close(false);render();};
    msg.textContent=isTouch?'칸을 눌러 핀을 꽂으세요.':'방향키 이동 · Space 핀 꽂기 · Enter 태엽 · Esc 닫기';
    pz.classList.remove('hidden');render();
  });
}

$('restart').onclick=()=>{location.hash='';location.reload();};

/* =========================================================
   입력
   ========================================================= */
const held={};let dirOrder=[];
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function pressDir(d,on){if(on){if(!held[d]){held[d]=true;dirOrder.push(d);}}else{held[d]=false;dirOrder=dirOrder.filter(x=>x!==d);}}
function curDir(){return dirOrder[dirOrder.length-1];}
addEventListener('keydown',e=>{
  audioInit();
  const d=KEYMAP[e.code];
  if(puzzleKeys){e.preventDefault();if(d)puzzleKeys(d);else if(e.code==='Space')puzzleKeys('act');else if(e.code==='Enter'||e.code==='NumpadEnter')puzzleKeys('enter');else if(e.code==='Escape')puzzleKeys('esc');return;}
  if(choice&&d&&(d==='up'||d==='down')){e.preventDefault();choice.sel=(choice.sel+(d==='down'?1:choice.n-1))%choice.n;choice.render();return;}
  if(d){e.preventDefault();pressDir(d,true);return;}
  if(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'||e.code==='NumpadEnter'){e.preventDefault();if(!e.repeat)onAction();}
});
addEventListener('keyup',e=>{const d=KEYMAP[e.code];if(d)pressDir(d,false);});
addEventListener('blur',()=>{for(const k in held)held[k]=false;dirOrder=[];});
function onAction(){
  audioInit();
  if(!started){startGame();return;}
  if(choice){choice.fin(choice.sel);return;}
  if(typeSkip){typeSkip();return;}
  if(waiters.length){const w=waiters;waiters=[];w.forEach(f=>f());return;}
  if(!locked&&!P.moving&&!P.hidden)tryInteract();
}
$('dialog').addEventListener('pointerdown',e=>{e.preventDefault();onAction();});
$('title').addEventListener('pointerdown',e=>{e.preventDefault();onAction();});
if(isTouch){
  $('touch').classList.remove('hidden');
  document.querySelectorAll('.tb[data-d]').forEach(b=>{const d=b.dataset.d;
    const on=e=>{e.preventDefault();audioInit();b.classList.add('down');if(choice&&(d==='up'||d==='down')){choice.sel=(choice.sel+(d==='down'?1:choice.n-1))%choice.n;choice.render();return;}if(puzzleKeys)return;pressDir(d,true);};
    const off=e=>{e.preventDefault();b.classList.remove('down');pressDir(d,false);};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
  $('tA').addEventListener('pointerdown',e=>{e.preventDefault();onAction();});
}
function tryInteract(){
  const fx=P.x+DX[P.dir],fy=P.y+DY[P.dir];
  let e=ents.find(e=>!e.hidden&&e.on&&covers(e,fx,fy)&&e.kind==='char')||ents.find(e=>!e.hidden&&e.on&&covers(e,fx,fy));
  if(e)run(()=>e.on(e));
}

/* =========================================================
   업데이트 & 렌더 루프
   ========================================================= */
function update(dt){
  T+=dt;
  if(P.moving){
    const sp=4.6*dt,dx=P.tx-P.fx,dy=P.ty-P.fy,d=Math.abs(dx)+Math.abs(dy);
    if(d<=sp){P.fx=P.tx;P.fy=P.ty;P.x=P.tx;P.y=P.ty;P.moving=false;}
    else{P.fx+=Math.sign(dx)*sp;P.fy+=Math.sign(dy)*sp;}
  }
  if(!P.moving&&!locked&&!P.hidden&&!choice&&!puzzleKeys){
    const d=curDir();
    if(d){P.dir=d;const nx=P.x+DX[d],ny=P.y+DY[d];if(!solidAt(nx,ny)){P.tx=nx;P.ty=ny;P.moving=true;}}
  }
  for(const e of ents){
    if(e.path&&e.path.length){
      const [tx,ty]=e.path[0],dx=tx-e.fx,dy=ty-e.fy,d=Math.hypot(dx,dy),st=e.speed*dt;
      if(Math.abs(dx)>.01||Math.abs(dy)>.01)e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
      if(d<=st){e.fx=e.x=tx;e.fy=e.y=ty;e.path.shift();if(!e.path.length){e.walking=false;const f=e.onDone;e.onDone=null;f&&f();}}
      else{e.fx+=dx/d*st;e.fy+=dy/d*st;e.walking=true;}
    }
  }
  if(S&&S.storm){nextFlash-=dt;if(nextFlash<=0){flash=1;nextFlash=7+Math.random()*8;setTimeout(()=>SFX.thunder(),700+Math.random()*900);}}
  flash=Math.max(0,flash-dt*2.2);
  for(const m of motes){m.y-=m.s*dt*14;m.x+=Math.sin(T+m.a)*dt*3;if(m.y<-2){m.y=H+2;m.x=Math.random()*W;}}
}
function drawLights(){
  if(!S.dark)return;
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,W,H);
  lx.fillStyle=`rgba(${S.darkC||'0,0,10'},${S.dark})`;lx.fillRect(0,0,W,H);
  lx.globalCompositeOperation='destination-out';
  const L=S.lights().slice();
  if(!P.hidden)L.push({x:P.fx*16+8,y:P.fy*16+6,r:44});
  const lh=ent('lh');if(lh&&lh.lamp&&S.lit)L.push({x:lh.lamp[0],y:lh.lamp[1],r:40,c:'255,230,160'});
  for(const l of L){
    let r=l.r;if(l.fl)r*=.92+.08*Math.sin(T*11+Math.sin(T*7));
    if(l.beam)r*=.4+.9*Math.pow(Math.max(0,Math.cos(T*.8)),6);
    const g=lx.createRadialGradient(l.x,l.y,0,l.x,l.y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
    lx.fillStyle=g;lx.beginPath();lx.arc(l.x,l.y,r,0,7);lx.fill();
  }
  ctx.drawImage(lc,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const l of L){if(!l.c)continue;const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r*.8);g.addColorStop(0,`rgba(${l.c},.16)`);g.addColorStop(1,`rgba(${l.c},0)`);ctx.fillStyle=g;ctx.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);}
  ctx.globalCompositeOperation='source-over';
}
function drawBeam(){
  const lh=ent('lh');if(!lh||!lh.lamp||!S.lit)return;
  const [cx,cy]=lh.lamp;ctx.globalCompositeOperation='lighter';
  for(const off of [0,Math.PI]){const a=T*.7+off,sp=.11,len=260;
    if(Math.sin(a)<-.2)continue;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,len);g.addColorStop(0,'rgba(255,240,180,.35)');g.addColorStop(1,'rgba(255,240,180,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a-sp)*len,cy+Math.sin(a-sp)*len*.45);ctx.lineTo(cx+Math.cos(a+sp)*len,cy+Math.sin(a+sp)*len*.45);ctx.closePath();ctx.fill();}
  ctx.globalCompositeOperation='source-over';
}
function draw(){
  R(0,0,W,H,'#000');if(!S)return;
  drawTiles();
  for(const e of ents)if(e.layer===0&&!e.hidden)DRAW[e.kind](e,e.fx*TS,e.fy*TS);
  const list=ents.filter(e=>e.layer!==0&&!e.hidden).map(e=>({k:e.fy+e.h+(e.kind==='char'?.01:0)+(e.kind==='char'&&e.sit?.1:0),e}));
  if(!P.hidden)list.push({k:P.fy+1.02,p:1});
  list.sort((a,b)=>a.k-b.k);
  for(const it of list){
    if(it.p)drawChar(P.fx*TS,P.fy*TS-2,LOOK.seoyun,P.dir,P.moving?(Math.floor(T*8)%2?1:2):0);
    else DRAW[it.e.kind](it.e,it.e.fx*TS,it.e.fy*TS);
  }
  if(S.tint){ctx.globalCompositeOperation='soft-light';ctx.fillStyle=S.tint.replace(/[\d.]+\)$/,'.55)');ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';ctx.fillStyle=S.tint;ctx.fillRect(0,0,W,H);}
  drawLights();
  drawBeam();
  if(S.memory){for(const m of motes){ctx.fillStyle=`rgba(255,240,210,${.25+.25*Math.sin(T*2+m.a)})`;ctx.fillRect(m.x|0,m.y|0,1,1);}}
  for(const e of ents)if(e.glow&&!e.hidden)drawGlow(e);
  if(flash>0&&S.storm){ctx.fillStyle=`rgba(210,225,255,${flash*.35})`;ctx.fillRect(0,0,W,H);}
  ctx.drawImage(vg,0,0);
  if(S.memory){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,0,W,1);ctx.fillRect(0,H-1,W,1);}
}
let last=performance.now();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);draw();requestAnimationFrame(frame);}

   시작

  await cardHide(1000);
  await goScene('present','<h1>2026년 11월 13일</h1><p>해안 마을 등불리 · 비</p>',{white:false,hold:2200});
}

function debugJump(){
  const h=location.hash.slice(1);if(!h)return false;

}
layout();
if(!debugJump())loadScene('title');
requestAnimationFrame(frame);
