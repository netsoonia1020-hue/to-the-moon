<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05060a">
<title>등대지기의 오르골</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="toast"></div>
<div id="hud"></div>
<div id="hint">방향키 / WASD 이동 · Space / Enter 조사</div>
<div id="opts"><button id="oSnd">🔊 소리</button><button id="oVoice">🗣 음성</button><button id="oSave">💾 저장</button><button id="oBook">📖 일지</button></div>
<canvas id="bust" width="300" height="380"></canvas>
<div id="goal"></div>
<div id="dialog" class="hidden"><canvas id="dport" width="64" height="64"></canvas><div id="dname"></div><div id="dtext"></div><div id="dnext" class="hidden">▼</div></div>
<div id="choices" class="hidden"></div>
<div id="puzzle" class="panel hidden">
  <div class="t">오르골 원통 — 핀 꽂기</div>
  <div class="h">세로줄 하나에 핀 하나. 왼쪽부터 차례로 울립니다.<br>기억 속에서 들은 순서대로 꽂으세요. 칸을 누르면 그 음이 들립니다.<br>낡은 원통이 버틸 수 있는 태엽: <b id="pzTries"></b></div>
  <div id="pzGrid"></div>
  <div class="pzb"><button id="pzPlay">태엽 감기 ▶</button><button id="pzClear">초기화</button><button id="pzClose">닫기</button></div>
  <div id="pzMsg"></div>
</div>
<div id="piano" class="panel hidden">
  <div class="t">낡은 피아노</div>
  <div class="h">건반을 누르거나 숫자키 1–7로 연주합니다. (Esc: 닫기)</div>
  <div id="pnKeys"></div>
  <div class="pzb"><button id="pnClose">닫기</button></div>
  <div id="pnMsg"></div>
</div>
<div id="saves" class="panel hidden">
  <div class="t" id="svTitle">저장 / 불러오기</div>
  <div class="h" id="svHint"></div>
  <div id="svList"></div>
  <div class="pzb"><button id="svClose">닫기</button></div>
  <div id="svMsg"></div>
</div>
<div id="touch" class="hidden"><div class="tb" id="tA">조사</div></div>
<div id="joy"><div id="joyK"></div></div>
<div id="mini" class="panel hidden"><div class="t" id="mnT"></div><div class="h" id="mnH"></div>
  <div id="mnBarW"><div id="mnBar"></div></div>
  <div id="mnDial" class="hidden"><div id="mnScale"></div><div id="mnNeedle"></div><div id="mnSigW"><div id="mnSig"></div></div></div>
  <div class="pzb" id="mnBtns"></div></div>
<div id="cutin" class="hidden"><div class="band"><canvas id="ciPort" width="64" height="64"></canvas><div id="ciText"></div></div></div>
<div id="intro" class="hidden"><canvas id="inPort" width="300" height="380"></canvas><div class="it"><div id="inRole"></div><div id="inName"></div><div id="inDesc"></div></div></div>
<div id="journal" class="panel hidden"><div class="t">기억 일지</div><div id="jBody"></div><div class="pzb"><button id="jClose">닫기</button></div></div>
<div id="credits" class="hidden"><div id="crIn"></div></div>
<div id="fader"></div>
<div id="card"></div>
<div id="title">
  <h1 id="titleH">등대지기의 오르골</h1>
  <div class="sub">어느 유품정리사가 본, 여섯 음의 기억</div>
  <div id="menu"></div>
  <div id="gallery"></div>
  <div class="small">소리를 켜고 플레이하세요 (아이폰은 무음 스위치 해제) · 약 1시간 20분 · 9장 · 엔딩 5개</div>
</div>
<div id="endcard" class="hidden"><div class="tag" id="endTag"></div><h1 id="endTitle"></h1><p id="endDesc"></p><p id="endProg"></p><button id="restart">타이틀로</button></div>
<script src="js/core.js"></script>
<script src="js/music.js"></script>
<script src="js/art.js"></script>
<script src="js/portrait.js"></script>
<script src="js/paint.js"></script>
<script src="js/scenes.js"></script>
<script src="js/story_a.js"></script>
<script src="js/story_b.js"></script>
<script src="js/ending.js"></script>
</body>
</html>
